name: CI

on:
  push:
    branches: [main, pre-main]
  pull_request:
    branches: [main, pre-main]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN — every job only reads the repo (checkout, lint, test).
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # 1. Markdown / YAML — Prettier formatting check
  # --------------------------------------------------------------------
  lint-markdown:
    name: Markdown / YAML formatting check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install -g prettier

      - name: Prettier Check (Markdown & YAML)
        run: prettier --check "**/*.{md,yml,yaml}"

  # --------------------------------------------------------------------
  # 2. Python — ruff lint across .agents/ and scripts/ (recursive)
  # --------------------------------------------------------------------
  lint-py-agents:
    name: Python — ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff Linter Check
        run: |
          uvx ruff check .agents/ scripts/

  # --------------------------------------------------------------------
  # 3. Prompt manifest — compile_prompts.py must succeed.
  #    It sys.exit(1)s if a mapped prompt file is missing; manifest
  #    completeness/non-emptiness is asserted in the unit tests.
  # --------------------------------------------------------------------
  validate-subagent-manifest:
    name: Prompt manifest compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile prompt manifest
        run: |
          python3 .agents/scripts/compile_prompts.py

  # --------------------------------------------------------------------
  # 4. Python — unit tests (hermetic: no live GCP / network)
  # --------------------------------------------------------------------
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Run pytest
        run: |
          uvx pytest tests/ -v

  # --------------------------------------------------------------------
  # 5. Terraform — fmt + validate (runs only if labs/dev is present)
  # --------------------------------------------------------------------
  terraform-check:
    name: Labs Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Fmt Check (Recursive)
        run: |
          if [ -d "labs/dev" ]; then
            terraform fmt -check -recursive labs/dev/
          else
            echo "labs/dev directory not found, skipping terraform fmt."
          fi

      - name: Validate Terraform (All Dev Labs)
        run: |
          if [ -d "labs/dev" ]; then
            for dir in $(find labs/dev -type f -name "*.tf" -exec dirname {} \; | sort -u); do
              echo "Initializing and validating Terraform in: $dir"
              cd $GITHUB_WORKSPACE/$dir
              terraform init -backend=false
              terraform validate
            done
          else
            echo "labs/dev directory not found, skipping terraform validate."
          fi
