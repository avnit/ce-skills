name: CI Pipeline (Lint, Security & Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality-and-security:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Security Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          # Check syntax and style violations
          ruff check .

      - name: Security Scan with Bandit (AST Vulnerability Check)
        run: |
          # Scan application modules for common Python security vulnerabilities
          bandit -r admin_portal/ mcp/ scripts/ -ll

      - name: Dependency Security Audit
        run: |
          # Check requirements.txt against known CVE advisory databases
          pip-audit -r requirements.txt || true # soft warn if advisory published

  docker-build-verification:
    name: Container Build Check
    runs-on: ubuntu-latest
    needs: code-quality-and-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Container Image
        run: |
          docker build -t closed-loop-app:test .
