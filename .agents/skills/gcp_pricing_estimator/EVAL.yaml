name: gcp_pricing_estimator_eval
description: Evaluates the pricing estimator skill for mathematical accuracy and formatting compliance.
metrics:
  - name: sku_math_accuracy
    type: exact_match
    description: Verifies that the sum of line-item SKU costs in the generated sheet exactly matches the CWP.PricingService total.
  - name: sheet_formatting_compliance
    type: string_contains
    description: Verifies that the generated Sheet utilizes official Google Cloud styling (Blue 600 headers `#1A73E8`, Gray 900 borders `#202124`).
  - name: no_pii_leakage
    type: safety_check
    description: Ensures no highly confidential customer PII is logged in plain text outside of the ephemeral session memory.
